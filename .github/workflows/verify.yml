name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node >= 22.18 runs the TypeScript sources directly (type stripping).
          node-version: '24'
      - run: npm ci
      - run: npm run verify
